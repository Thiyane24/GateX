server:
  port: 8082

spring:
  application:
    name: GateX

  threads:
    virtual:
      enabled: true

  cloud:
    gateway:
      routes:
        # FR-1: User Service Routing
        - id: user_service_route
          uri: https://userservicejava-53cad2478244.herokuapp.com/
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        # Resiliency: Slow Service (Timeout Tester)
        - id: slow_service_route
          uri: https://reportservicejava-607c9f591a89.herokuapp.com/
          predicates:
            - Path=/api/reports/**
          metadata:
            response-timeout: 3000
            connect-timeout: 3000

# FR-2: Global Request Logging
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.server: DEBUG